name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for uncommitted changes
        run: |
          npm run build
          if ! git diff --exit-code; then
            echo "Build output differs from committed code"
            exit 1
          fi

      - name: Verify dist is up to date
        run: |
          if [ -d dist ]; then
            git check-ignore -q dist/ || {
              echo "dist/ should be .gitignored"
              exit 1
            }
          fi
